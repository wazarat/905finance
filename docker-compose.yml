# Local development database. Not used in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: nof905-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nof
      POSTGRES_PASSWORD: nof_local_dev
      POSTGRES_DB: nof905
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nof905_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nof -d nof905"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nof905_pgdata:
